name: Luca Real Lip Sync Visual Review

on:
  workflow_run:
    workflows: ["Luca Real Lip Sync MuseTalk CPU Pilot"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only CPU image review tools in cloud
        shell: bash
        run: |
          python -m pip install --quiet Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Check actual lip-motion video frames and audio
        run: python social/luca_lipsync_review.py
      - name: Save review contact sheets for human quality control
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sito Lume Cloud Studio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/lipsync
          if ! git diff --cached --quiet; then
            git commit -m "Luca: visual QC frames and human lip-sync review pending"
            git pull --rebase origin main
            git push
          fi
